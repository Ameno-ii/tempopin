<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TempoPin sync test</title>
<style>body{font-family:sans-serif;max-width:420px;margin:auto;padding:20px}
button{width:100%;padding:14px;font-size:16px;margin:6px 0;border-radius:12px;border:0;background:#111;color:#fff}
#st,#bat{margin:10px 0;color:#666}</style></head><body>
<h2>TempoPin sync test</h2>
<button onclick="connect()">เชื่อมต่อพวงกุญแจ</button>
<div id="st">ยังไม่เชื่อมต่อ</div><div id="bat"></div>
<button onclick="demo()">ส่งตารางทดสอบ</button>
<script>
const SVC='6e400001-b5a3-f393-e0a9-e50e24dcca9e',RX='6e400002-b5a3-f393-e0a9-e50e24dcca9e',TX='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
let rx=null;const st=t=>document.getElementById('st').textContent=t;
async function connect(){
 try{
  const dev=await navigator.bluetooth.requestDevice({filters:[{name:'TempoPin'}],optionalServices:[SVC]});
  dev.addEventListener('gattserverdisconnected',()=>{rx=null;st('หลุดการเชื่อมต่อ')});
  const svc=await (await dev.gatt.connect()).getPrimaryService(SVC);
  rx=await svc.getCharacteristic(RX);
  const tx=await svc.getCharacteristic(TX);
  await tx.startNotifications();
  tx.addEventListener('characteristicvaluechanged',e=>{
   const s=new TextDecoder().decode(e.target.value);
   if(s.startsWith('B|'))document.getElementById('bat').textContent='🔋 แบตพวงกุญแจ '+s.slice(2).trim()+'%';
  });
  st('เชื่อมต่อแล้ว ✓');
 }catch(e){st('ผิดพลาด: '+e.message)}
}
async function sendLines(lines){
 const data=new TextEncoder().encode(lines.join('\n')+'\n');
 for(let i=0;i<data.length;i+=20)await rx.writeValueWithResponse(data.slice(i,i+20));
}
async function demo(){
 if(!rx){st('ยังไม่ได้เชื่อมต่อ');return}
 const now=Math.floor(Date.now()/1000),tz=-new Date().getTimezoneOffset()*60,s=now+150;
 const lines=['T|'+now+'|'+tz,'C',
  'A|'+s+'|'+(s+3600)+'|3|2|Rain|'+(now+15)+'|'+(now+45)+'|'+(now+90)+'|'+s+'|Meeting',
  'A|'+(now+3600)+'|'+(now+5400)+'|1|0|Sunny|0|0|'+(now+3000)+'|'+(now+3600)+'|Class',
  'A|'+(now+7200)+'|0|0|0|Cloudy|0|0|0|'+(now+7200)+'|Lunch','D'];
 try{await sendLines(lines);st('ส่งตารางแล้ว ✓ ดูพวงกุญแจ')}catch(e){st('ส่งไม่สำเร็จ: '+e.message)}
}
</script></body></html>
